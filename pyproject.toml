[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-yaml-reader"
version = "0.1.0"
description = "Source-agnostic YAML file reader for declarative-content libraries in the Evennia ecosystem."
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Tim Baird"}]
requires-python = ">=3.10"
keywords = ["evennia", "yaml", "mud", "reader", "content"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Deliberate divergence from the library standards: this library is a pure-Python
# primitive with no Evennia runtime dependency. See CLAUDE.md principle 5.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/FullCircleMUD/evennia-yaml-reader"
Repository = "https://github.com/FullCircleMUD/evennia-yaml-reader"
Issues = "https://github.com/FullCircleMUD/evennia-yaml-reader/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evennia_yaml_reader*"]

[tool.setuptools.package-data]
evennia_yaml_reader = ["*.md"]
